spring.application.name=StayO

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/stayo}
spring.mongodb.auto-index-creation=true


server.port=${PORT:8081}
server.address=0.0.0.0

# JWT Configuration
jwt.secret=${JWT_SECRET:development_jwt_secret_key_which_is_long_enough_for_validation_123456}
jwt.expiration=86400000

# Twilio SMS Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:your_twilio_account_sid_here}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_twilio_auth_token_here}
twilio.phone-number=${TWILIO_MOBILE_NUMBER:your_twilio_phone_number_here}

# OTP Configuration
otp.expiry-minutes=5
otp.max-attempts=3
otp.static-code=123456
otp.use-static=${OTP_USE_STATIC:false}

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Health Check Ping Configuration (Every 14 mins)
health.ping.url=http://localhost:${server.port}/health
health.ping.cron=0 */5 * * * *
