spring.application.name=StayO

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/stayo}

server.port=${PORT:8081}
server.address=0.0.0.0

# JWT Configuration
jwt.secret=${JWT_SECRET:development_jwt_secret_key_which_is_long_enough_for_validation_123456}
jwt.expiration=86400000

# SMS Gateway Configuration
sms.gateway.provider=${SMS_GATEWAY_PROVIDER:cloud}

# Local SMS Gateway Configuration
sms.gateway.local.url=${SMS_GATEWAY_LOCAL_URL:http://10.121.100.178:8080/message}
sms.gateway.local.username=${SMS_GATEWAY_LOCAL_USERNAME:sms}
sms.gateway.local.password=${SMS_GATEWAY_LOCAL_PASSWORD:eNdUOw9H}

# Cloud SMS Gateway Configuration (sms-gate.app)
sms.gateway.cloud.url=${SMS_GATEWAY_CLOUD_URL:https://api.sms-gate.app/3rdparty/v1/messages}
sms.gateway.cloud.username=${SMS_GATEWAY_CLOUD_USERNAME:Q8QCCR}
