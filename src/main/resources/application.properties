sms.gateway.cloud.device-id=${SMS_GATEWAY_CLOUD_DEVICE_ID:MiCjpLO_kh7Ay9sT_TNdF}

# OTP Configuration
otp.expiry-minutes=5
otp.max-attempts=3
otp.static-code=123456

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Health Check Ping Configuration (Every 14 mins)
health.ping.url=http://localhost:${server.port}/health
health.ping.cron=0 */14 * * * *

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://stay-o-frontend.vercel.app,http://localhost:5173,http://localhost:3000,http://10.105.18.145:8081}

