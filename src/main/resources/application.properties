spring.application.name=StayO

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/stayo}

server.port=${PORT:8081}
server.address=0.0.0.0

# JWT Configuration
jwt.secret=${JWT_SECRET:development_jwt_secret_key_which_is_long_enough_for_validation_123456}
jwt.expiration=86400000

# Twilio SMS Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACdevelopment_dummy_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:development_dummy_token}
twilio.phone-number=${TWILIO_MOBILE_NUMBER:+1234567890}

# OTP Configuration
otp.expiry-minutes=5
otp.max-attempts=3
otp.static-code=123456

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html